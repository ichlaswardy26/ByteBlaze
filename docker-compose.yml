services:
  byteblaze:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: byteblaze
    restart: unless-stopped
    volumes:
      - ./app.yml:/app/app.yml        # Mount langsung ke root
      - ./logs:/app/logs              # Direktori logs
      - ./data:/app/data              # Direktori data
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          memory: 768M                # Lebih aman untuk VPS 2GB
    networks:
      - byteblaze-net

networks:
  byteblaze-net:
    name: byteblaze-network
